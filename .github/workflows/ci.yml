name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Prepare KyonLM model directory
        run: |
          chmod +x ./scripts/setup_model.sh
          ./scripts/setup_model.sh

      - name: Resolve Swift Package dependencies
        run: |
          xcodebuild -resolvePackageDependencies -project gg.xcodeproj -scheme gg
          find ~/Library/Developer/Xcode/DerivedData -name "SwiftyOpenCC" -type d | while read dir; do
            (cd "$dir" && git submodule update --init --recursive)
          done

      - name: Pre-build Data target
        run: |
          (cd Source/Data && make build)

      - name: Build gg Input Method
        run: |
          xcodebuild build -project gg.xcodeproj -scheme gg -configuration Debug -destination "platform=macOS,arch=arm64" || \
          (echo "Retrying build due to transient Xcode scheduler inconsistency..." && xcodebuild build -project gg.xcodeproj -scheme gg -configuration Debug -destination "platform=macOS,arch=arm64")

      - name: Run Unit Tests
        run: |
          xcodebuild test -project gg.xcodeproj -scheme gg -destination "platform=macOS,arch=arm64"
